name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@083d5237d9340d541bf95e2a6eceaf3529b85892 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run checks
        run: composer check

  release:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@083d5237d9340d541bf95e2a6eceaf3529b85892 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate tag matches metadata version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(php -r 'echo json_decode(file_get_contents("metadata.json"), true)["version"];')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match metadata.json version v$VERSION" >&2
            exit 1
          fi

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE="xExtension-KillTheNews-${TAG}.zip"
          mkdir -p build/KillTheNews
          cp -R Controllers i18n static views build/KillTheNews/
          cp KillTheNewsClient.php configure.phtml extension.php metadata.json README.md CHANGELOG.md LICENSE build/KillTheNews/
          (cd build && zip -r "$ARCHIVE" KillTheNews)
          (cd build && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Publish GitHub release
        uses: softprops/action-gh-release@403a5240f3837fa857f642062e05aad6bb3391ca # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/xExtension-KillTheNews-${{ github.event.inputs.tag || github.ref_name }}.zip
            build/xExtension-KillTheNews-${{ github.event.inputs.tag || github.ref_name }}.zip.sha256
          generate_release_notes: true
