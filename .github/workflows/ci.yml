name: CI

on:
  push:
  pull_request:

jobs:
  runtime-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@c9e91c1e82efe32ee3ef318644269fae0b59d832 # v2
        with:
          php-version: '8.1'
          extensions: curl, json
          coverage: none

      - name: Validate runtime dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@c9e91c1e82efe32ee3ef318644269fae0b59d832 # v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run checks
        run: composer check
